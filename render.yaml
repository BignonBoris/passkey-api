services:
  - type: web
    name: passkey-api
    env: node
    autoDeploy: true
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: PORT
        value: 10000
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_BOOTSTRAP_ON_START
        value: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_RESET_SECRET
        sync: false
      - key: JWT_VERIFY_SECRET
        sync: false
      - key: JWT_VERIFY_REFRESH_SECRET
        sync: false
      - key: JWT_VERIFY_RESET_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
